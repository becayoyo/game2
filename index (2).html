<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081526">
<title>晶曜五子棋｜Crystal Gomoku</title>
<style>
:root{color-scheme:dark;--bg:#071321;--panel:rgba(16,35,58,.72);--line:rgba(151,214,255,.2);--cyan:#8cecff;--gold:#ffd994}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1d4262 0,#0a1b2e 44%,#050c17 100%);color:#eaf7ff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(125deg,transparent 25%,rgba(125,220,255,.035) 48%,transparent 70%);mix-blend-mode:screen}
.wrap{width:min(1180px,100%);margin:auto;padding:24px clamp(12px,3vw,32px) 36px}
header{text-align:center;margin-bottom:20px}h1{margin:0;font-size:clamp(27px,4vw,43px);letter-spacing:.12em;font-weight:800;background:linear-gradient(110deg,#fff,#8de8ff 45%,#d8c4ff 80%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 16px #65dfff55)}
.sub{color:#9ebbd1;letter-spacing:.22em;font-size:12px;margin-top:5px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;align-items:start}
.board-shell,.panel{background:linear-gradient(145deg,rgba(36,73,105,.45),rgba(8,22,39,.86));border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 60px #0008,inset 0 1px 0 #ffffff1c;backdrop-filter:blur(18px)}
.board-shell{padding:clamp(8px,2vw,18px);position:relative;overflow:hidden}
.board-shell:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(130deg,#b8f4ff15,transparent 30%,transparent 70%,#c9aaff12)}
#board{display:block;width:100%;height:auto;aspect-ratio:1;touch-action:manipulation;border-radius:14px;cursor:crosshair}
.side{display:grid;gap:14px}.panel{padding:18px}.panel h2{font-size:13px;letter-spacing:.16em;color:#9dc7df;margin:0 0 13px}
.status{font-size:17px;font-weight:700;line-height:1.5}.turn{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.orb{width:18px;height:18px;border-radius:50%;box-shadow:0 0 14px currentColor;display:inline-block}
.orb.black{background:radial-gradient(circle at 32% 25%,#fff,#a8c7db 15%,#25394c 43%,#03070c 78%);color:#8cecff}
.orb.white{background:radial-gradient(circle at 32% 25%,#fff,#fff 28%,#b9d8eb 63%,#6385a1);color:#fff}
.muted{font-size:12px;color:#8eaabd;line-height:1.65}
button,select{font:inherit;color:#eaf7ff;background:linear-gradient(145deg,#244a68,#10283f);border:1px solid #8bdfff45;border-radius:12px;padding:11px 13px;box-shadow:inset 0 1px #ffffff20,0 6px 16px #0003}
button{cursor:pointer;transition:.18s}button:hover{transform:translateY(-1px);border-color:#9cecffaa;box-shadow:0 0 18px #62dfff28}button:active{transform:translateY(1px)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls .wide{grid-column:1/-1}
select{width:100%;margin-top:8px}.score{display:flex;justify-content:space-between;color:#b7d2e3;font-size:13px;padding:5px 0}.score strong{color:#fff;font-variant-numeric:tabular-nums}
#message{min-height:25px;color:var(--gold);font-size:13px;margin-top:10px}
.footer{text-align:center;color:#66869e;font-size:11px;margin-top:16px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.panel:first-child{grid-column:1/-1}}
@media(max-width:520px){.wrap{padding:15px 10px 24px}header{margin-bottom:14px}.side{grid-template-columns:1fr}.panel:first-child{grid-column:auto}.panel{padding:15px}.board-shell{border-radius:17px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>晶曜五子棋</h1><div class="sub">CRYSTAL GOMOKU · 3D GLASS EDITION</div></header>
<main class="layout">
<section class="board-shell"><canvas id="board" aria-label="五子棋棋盤"></canvas></section>
<aside class="side">
<section class="panel">
<h2>對弈狀態 / GAME STATUS</h2>
<div class="status" id="status">輪到你下棋</div>
<div class="turn"><span class="orb black" id="turnOrb"></span><span id="turnText">你的回合・黑水晶</span></div>
<div id="message">點選棋盤交叉點，開始對弈。</div>
<p class="muted">你執黑棋先行，AI 執白棋。率先連成五子（橫、直、斜）即可獲勝。</p>
</section>
<section class="panel">
<h2>對手設定 / AI LEVEL</h2>
<select id="level" aria-label="AI難度"><option value="easy">初階・輕鬆</option><option value="normal" selected>標準・平衡</option><option value="hard">進階・較強</option></select>
<p class="muted">AI 會評估進攻與防守位置，並優先阻止你連成四子。</p>
</section>
<section class="panel">
<h2>棋局紀錄 / SCORE</h2>
<div class="score"><span>你的勝場</span><strong id="wins">0</strong></div>
<div class="score"><span>AI 勝場</span><strong id="losses">0</strong></div>
<div class="score"><span>目前手數</span><strong id="moves">0</strong></div>
</section>
<section class="panel">
<h2>操作 / CONTROLS</h2>
<div class="controls">
<button id="undo">↶ 悔棋</button><button id="restart">重新開始</button>
<button id="sound" class="wide">音效：開啟</button>
</div>
<p class="muted">悔棋會同時收回你與 AI 最近的一手。重新開始可開新局。</p>
</section>
</aside>
</main>
<div class="footer">CRYSTAL GOMOKU · HTML5 / WebGL · 手機、平板、桌機皆適用</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const N=15, canvas=document.querySelector('#board'), ctx=canvas.getContext('2d');
const statusEl=document.querySelector('#status'), turnText=document.querySelector('#turnText'), turnOrb=document.querySelector('#turnOrb'), msg=document.querySelector('#message');
const moveEl=document.querySelector('#moves'), winsEl=document.querySelector('#wins'), lossesEl=document.querySelector('#losses');
let board=Array.from({length:N},()=>Array(N).fill(0)), history=[], gameOver=false, thinking=false, wins=0,losses=0,soundOn=true;
let scene,camera,renderer,boardMesh,stones=[],raycaster,mouse,webgl=false,boardSize=14;
const dirs=[[1,0],[0,1],[1,1],[1,-1]];
function init3D(){
 try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(800,800,false); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a1c2c);
  camera=new THREE.PerspectiveCamera(34,1,.1,100); camera.position.set(0,17,18); camera.lookAt(0,0,0);
  scene.add(new THREE.HemisphereLight(0xc5f4ff,0x14243b,2.0));
  const key=new THREE.PointLight(0x8cecff,90,35);key.position.set(-7,11,8);scene.add(key);
  const fill=new THREE.PointLight(0xb49aff,65,30);fill.position.set(8,8,-7);scene.add(fill);
  const base=new THREE.Mesh(new THREE.BoxGeometry(15.1,.55,15.1),new THREE.MeshPhysicalMaterial({color:0x15334c,metalness:.48,roughness:.22,clearcoat:1,clearcoatRoughness:.12}));base.position.y=-.36;scene.add(base);
  const top=new THREE.Mesh(new THREE.PlaneGeometry(15,15),new THREE.MeshPhysicalMaterial({color:0x24425a,metalness:.25,roughness:.32,clearcoat:1,clearcoatRoughness:.18}));top.rotation.x=-Math.PI/2;top.position.y=-.075;scene.add(top);
  const gridMat=new THREE.LineBasicMaterial({color:0x9edcf0,transparent:true,opacity:.58});
  for(let i=0;i<N;i++){let p=-7+i;let a=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p,-.055,-7),new THREE.Vector3(p,-.055,7)]);let b=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-7,-.055,p),new THREE.Vector3(7,-.055,p)]);scene.add(new THREE.Line(a,gridMat),new THREE.Line(b,gridMat));}
  for(const x of [3,7,11])for(const z of [3,7,11]){const dot=new THREE.Mesh(new THREE.SphereGeometry(.075,16,12),new THREE.MeshBasicMaterial({color:0xc9f4ff}));dot.position.set(x-7,-.035,z-7);scene.add(dot)}
  raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();webgl=true; resize(); animate();
 }catch(e){webgl=false;drawFallback()}
}
function resize(){const w=canvas.parentElement.clientWidth; if(webgl){renderer.setSize(w,w,false);camera.aspect=1;camera.updateProjectionMatrix()}else drawFallback()}
function animate(){if(!webgl)return;requestAnimationFrame(animate);renderer.render(scene,camera)}
function stoneMesh(x,y,color){const mat=color===1?new THREE.MeshPhysicalMaterial({color:0x122536,metalness:.5,roughness:.08,transmission:.28,thickness:.8,ior:1.45,clearcoat:1,clearcoatRoughness:.04}):new THREE.MeshPhysicalMaterial({color:0xd9f5ff,metalness:.12,roughness:.06,transmission:.55,thickness:1,ior:1.5,clearcoat:1,clearcoatRoughness:.025});
 const m=new THREE.Mesh(new THREE.SphereGeometry(.43,36,28),mat);m.scale.y=.68;m.position.set(x-7,.28,y-7);scene.add(m);
 const glow=new THREE.PointLight(color===1?0x58cfff:0xc8efff,color===1?1.1:.7,2.2);glow.position.set(x-7,.55,y-7);scene.add(glow);stones.push({mesh:m,glow});}
function drawFallback(){const w=canvas.clientWidth||600;canvas.width=w*devicePixelRatio;canvas.height=w*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,w,w);const pad=w*.07,step=(w-2*pad)/(N-1);const g=ctx.createLinearGradient(0,0,w,w);g.addColorStop(0,'#315d78');g.addColorStop(1,'#10283d');ctx.fillStyle=g;ctx.fillRect(0,0,w,w);ctx.strokeStyle='#a8e8ff99';ctx.lineWidth=1;for(let i=0;i<N;i++){let p=pad+i*step;ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(w-pad,p);ctx.moveTo(p,pad);ctx.lineTo(p,w-pad);ctx.stroke()}for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(board[y][x]){let px=pad+x*step,py=pad+y*step,r=step*.39;let gr=ctx.createRadialGradient(px-r*.3,py-r*.35,1,px,py,r);if(board[y][x]===1){gr.addColorStop(0,'#efffff');gr.addColorStop(.18,'#567b91');gr.addColorStop(.6,'#102536');gr.addColorStop(1,'#02070d')}else{gr.addColorStop(0,'#fff');gr.addColorStop(.55,'#d9f5ff');gr.addColorStop(1,'#6b9bb8')}ctx.fillStyle=gr;ctx.shadowColor='#76dfff';ctx.shadowBlur=9;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}
function render(){if(webgl){renderer.render(scene,camera)}else drawFallback();moveEl.textContent=history.length}
function playSound(freq=520){if(!soundOn)return;try{const ac=new AudioContext(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch{}}
function addMove(x,y,c){board[y][x]=c;history.push({x,y,c});if(webgl)stoneMesh(x,y,c);render();playSound(c===1?560:720);moveEl.textContent=history.length}
function removeLast(){const m=history.pop();if(!m)return;board[m.y][m.x]=0;if(webgl){const s=stones.pop();scene.remove(s.mesh);scene.remove(s.glow);s.mesh.geometry.dispose();s.mesh.material.dispose()}render()}
function won(x,y,c){for(const [dx,dy] of dirs){let count=1;for(const sign of [-1,1]){let a=x+dx*sign,b=y+dy*sign;while(a>=0&&a<N&&b>=0&&b<N&&board[b][a]===c){count++;a+=dx*sign;b+=dy*sign}}if(count>=5)return true}return false}
function finish(c){gameOver=true;if(c===1){wins++;winsEl.textContent=wins;statusEl.textContent='恭喜！你獲勝了';msg.textContent='漂亮的連線！再來一局嗎？'}else{losses++;lossesEl.textContent=losses;statusEl.textContent='AI 獲勝';msg.textContent='別氣餒，再挑戰一次！'}turnText.textContent='本局結束';turnOrb.className='orb '+(c===1?'black':'white');playSound(c===1?880:220)}
function updateTurn(ai=false){statusEl.textContent=ai?'AI 思考完成':'輪到你下棋';turnText.textContent=ai?'你的回合・黑水晶':'你的回合・黑水晶';turnOrb.className='orb black'}
function humanMove(x,y){if(gameOver||thinking||board[y][x])return;addMove(x,y,1);if(won(x,y,1)){finish(1);return}if(history.length===N*N){gameOver=true;statusEl.textContent='平手';return}thinking=true;statusEl.textContent='AI 思考中…';turnText.textContent='AI 回合・白水晶';turnOrb.className='orb white';msg.textContent='水晶 AI 正在分析棋形…';setTimeout(aiMove,240)}
function scoreLine(count,open){if(count>=5)return 1e9;if(count===4&&open===2)return 2e7;if(count===4&&open===1)return 2e6;if(count===3&&open===2)return 2e5;if(count===3&&open===1)return 2e4;if(count===2&&open===2)return 2500;if(count===2&&open===1)return 300;if(count===1&&open===2)return 40;return 1}
function evaluate(x,y,c){let total=0;for(const [dx,dy] of dirs){let count=1,open=0;for(const sign of [-1,1]){let a=x+dx*sign,b=y+dy*sign,steps=0;while(a>=0&&a<N&&b>=0&&b<N&&board[b][a]===c){count++;steps++;a+=dx*sign;b+=dy*sign}if(a>=0&&a<N&&b>=0&&b<N&&board[b][a]===0)open++}total+=scoreLine(count,open)}return total}
function candidateMoves(){let set=new Set();if(!history.length)return [[7,7]];for(const m of history)for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){let x=m.x+dx,y=m.y+dy;if(x>=0&&x<N&&y>=0&&y<N&&!board[y][x])set.add(y*N+x)}return [...set].map(v=>[v%N,Math.floor(v/N)])}
function aiMove(){if(gameOver){thinking=false;return}const level=document.querySelector('#level').value;let best=null,bestScore=-Infinity;for(const [x,y] of candidateMoves()){board[y][x]=2;let attack=evaluate(x,y,2);board[y][x]=0;board[y][x]=1;let defend=evaluate(x,y,1);board[y][x]=0;let center=14-(Math.abs(x-7)+Math.abs(y-7));let score=attack*1.08+defend*(level==='easy'?.78:level==='normal'?1.02:1.16)+center*3;if(level==='easy')score+=Math.random()*180;if(level==='normal')score+=Math.random()*35;if(score>bestScore){bestScore=score;best=[x,y]}}
 if(!best){gameOver=true;thinking=false;statusEl.textContent='平手';return}const [x,y]=best;addMove(x,y,2);thinking=false;if(won(x,y,2)){finish(2);return}updateTurn(true);msg.textContent='輪到你了，找出下一個好位置。'}
function undo(){if(thinking)return;if(!history.length)return;removeLast();if(history.length&&history[history.length-1].c===2)removeLast();gameOver=false;statusEl.textContent='輪到你下棋';turnText.textContent='你的回合・黑水晶';turnOrb.className='orb black';msg.textContent='已悔棋，請重新落子。'}
function restart(){board=Array.from({length:N},()=>Array(N).fill(0));history=[];gameOver=false;thinking=false;stones.forEach(s=>{scene.remove(s.mesh);scene.remove(s.glow);s.mesh.geometry.dispose();s.mesh.material.dispose()});stones=[];statusEl.textContent='輪到你下棋';turnText.textContent='你的回合・黑水晶';turnOrb.className='orb black';msg.textContent='新棋局開始，請你先下。';render()}
canvas.addEventListener('pointerdown',e=>{const rect=canvas.getBoundingClientRect();if(webgl){const px=(e.clientX-rect.left)/rect.width,py=(e.clientY-rect.top)/rect.height;mouse.set(px*2-1,-(py*2-1));raycaster.setFromCamera(mouse,camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),.075),point=new THREE.Vector3();if(raycaster.ray.intersectPlane(plane,point)){let x=Math.round(point.x+7),y=Math.round(point.z+7);if(x>=0&&x<N&&y>=0&&y<N&&Math.abs(point.x-(x-7))<.48&&Math.abs(point.z-(y-7))<.48)humanMove(x,y)}}else{const w=rect.width,pad=w*.07,step=(w-2*pad)/(N-1),x=Math.round((e.clientX-rect.left-pad)/step),y=Math.round((e.clientY-rect.top-pad)/step);if(x>=0&&x<N&&y>=0&&y<N)humanMove(x,y)}});
document.querySelector('#undo').onclick=undo;document.querySelector('#restart').onclick=restart;document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.target.textContent='音效：'+(soundOn?'開啟':'關閉')};
window.addEventListener('resize',resize);init3D();render();
</script>
</body>
</html>
